<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RocGestion | Dashboard Administrateur</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background-color: #030712; color: white; margin: 0; font-family: sans-serif;">

    <div style="display: flex; min-height: 100vh;">
        
        <nav style="width: 260px; background-color: #111827; border-right: 1px solid #1f2937; padding: 2rem; display: flex; flex-direction: column;">
            <div style="margin-bottom: 3rem;">
                <h1 style="font-size: 1.5rem; display: flex; align-items: center; margin: 0;">
                    <i class="fas fa-gem" style="color: #3b82f6; margin-right: 10px;"></i> ROC<span style="color: #3b82f6;">GESTION</span>
                </h1>
                <p style="font-size: 0.7rem; color: #4b5563; font-weight: bold; margin-top: 5px;">STATION : JURBISE_V1</p>
            </div>

            <ul style="list-style: none; padding: 0;">
                <li style="margin-bottom: 1.5rem;"><a href="javascript:void(0)" onclick="afficherSection('dashboard')" style="text-decoration: none; color: white;"><i class="fas fa-chart-line" style="width: 25px;"></i> Dashboard</a></li>
                <li style="margin-bottom: 1.5rem;"><a href="#" style="text-decoration: none; color: #9ca3af;"><i class="fas fa-users" style="width: 25px;"></i> Clients</a></li>
                <li style="margin-bottom: 1.5rem;"><a href="javascript:void(0)" onclick="afficherSection('parametres')" style="text-decoration: none; color: #9ca3af;"><i class="fas fa-cog" style="width: 25px;"></i> Paramètres</a></li>
            </ul>
        </nav>

        <main style="flex: 1; padding: 3rem;">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
                <div>
                    <h2 style="font-size: 1.8rem; margin: 0;">Bienvenue, <span style="color: #3b82f6;">Rémy</span></h2>
                    <p style="color: #9ca3af; margin: 5px 0 0 0;">Esprit d'analyse activé.</p>
                </div>
                <div style="background: rgba(59, 130, 246, 0.1); color: #3b82f6; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 0.8rem;">
                    <i class="fas fa-shield-alt"></i> SESSION SÉCURISÉE
                </div>
            </header>

            <div style="text-align: right; margin-bottom: 2rem;">
                <button class="btn-primary" onclick="ouvrirModale()" style="cursor: pointer;">
                    <i class="fas fa-plus"></i> NOUVEAU CLIENT
                </button>
            </div>

            <div class="roc-card">
                <h3 style="margin-top: 0;">Activités Récentes</h3>
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="text-align: left; color: #9ca3af; font-size: 0.8rem;">
                            <th style="padding: 1rem; border-bottom: 1px solid #1f2937;">CLIENT</th>
                            <th style="padding: 1rem; border-bottom: 1px solid #1f2937;">DATE</th>
                            <th style="padding: 1rem; border-bottom: 1px solid #1f2937;">STATUT</th>
                        </tr>
                    </thead>
                    <tbody id="client-table-body">
                        </tbody>
                </table>
            </div>
            <div id="section-dashboard">
        <header>...</header> <div class="stats">...</div> <div class="roc-card">...</div> </div>
        <div id="section-parametres" style="display: none;">
        <h2>Paramètres du Système</h2>
        <p>Configuration de la station JURBISE_V1</p>
    </div>
        </main>
    </div>

    <div id="modal-client" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: #111827; border: 1px solid #3b82f6; padding: 2.5rem; border-radius: 1.5rem; width: 400px;">
            <h3 style="margin-top: 0; color: white;">Ajouter un partenaire</h3>
            <div style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem;">
                <input type="text" id="new-client-name" placeholder="Nom de l'entreprise" style="padding: 12px; border-radius: 8px; background: #030712; border: 1px solid #374151; color: white;">
                <input type="text" id="new-client-sector" placeholder="Secteur">
                <input type="number" id="new-client-amount" placeholder="Prix">
                <button class="btn-primary" onclick="validerAjoutClient()" style="padding: 12px; cursor: pointer;">ENREGISTRER</button>
                <button onclick="fermerModale()" style="background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 0.8rem;">ANNULER</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
